<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Grano de corcho MUY sutil: vetas finas y de bajo contraste.
       Va encima de un color base cálido definido en el CSS. -->
  <defs>
    <filter id="veta" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.46 0.72" numOctaves="2" seed="17" stitchTiles="stitch" result="t"/>
      <feComponentTransfer in="t">
        <feFuncR type="discrete" tableValues="0.46 0.60 0.38"/>
        <feFuncG type="discrete" tableValues="0.34 0.46 0.27"/>
        <feFuncB type="discrete" tableValues="0.22 0.31 0.17"/>
        <feFuncA type="discrete" tableValues="0 0.13 0.19 0 0.07 0"/>
      </feComponentTransfer>
    </filter>
    <filter id="mancha" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="5" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="480" height="480" filter="url(#mancha)"/>
  <rect width="480" height="480" filter="url(#veta)"/>
</svg>
